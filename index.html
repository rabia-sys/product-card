<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Product preview card component</title> 
</head>
<body>
  <main>
 <div class="card">
  <!-- Left side - image -->
  <div class="card-image">
    <img src="images/image-product-desktop.jpg" alt="Perfume">
  </div>
  <!-- Right side - content -->
  <div class="card-content">
    <p class="category">PERFUME</p>
    <h1>Gabrielle Essence Eau De Parfum</h1>
    <p class="description">A floral, solar and voluptuous interpretation composed by Oliver Polge.Perfumer-Creator for the house of CHANEL.</p>
    <div class="price">
      <span class="new-price">$149.99</span>
      <span class="old-price">$169.99</span>
    </div>
    <button type="button">
      <img src="images/icon-cart.svg" alt="cart">
      Add to Cart
    </button>
  </div>

</div>
</main>
</body>
</html>
